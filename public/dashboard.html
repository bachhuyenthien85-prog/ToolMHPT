<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XZTW Bot Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/dashboard">XZTW Bot Manager</a>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Dashboard</h2>
    <button class="btn btn-success" id="btn-register" data-bs-toggle="modal" data-bs-target="#registerModal">+ Register Account</button>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Display Name</th>
          <th>Login</th>
          <th>Server</th>
          <th style="width:1%">Actions</th>
        </tr>
      </thead>
      <tbody id="accounts-body"></tbody>
    </table>
  </div>
  <div id="empty-msg" class="text-muted d-none">No accounts yet. Click "+ Register Account" to add one.</div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Register Account</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- Step 1: Code -->
        <div id="step-code">
          <label class="form-label">Nhập mã bảo mật</label>
          <input type="password" class="form-control" id="reg-code" placeholder="Mã bảo mật">
          <div class="text-danger mt-2" id="code-error"></div>
          <button class="btn btn-primary mt-3" id="btn-verify-code">Xác nhận</button>
        </div>
        <!-- Step 2: Form -->
        <div id="step-form" class="d-none">
          <div class="mb-2">
            <label class="form-label">Display Name</label>
            <input type="text" class="form-control" id="reg-display-name" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="reg-username" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="reg-password" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Server</label>
            <input type="text" class="form-control" id="reg-server" required>
          </div>
          <div class="text-danger mt-2" id="form-error"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-success d-none" id="btn-save-account">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
const REGISTER_CODE = 'Vunb7117@';

async function loadAccounts() {
  const res = await fetch('/api/accounts');
  const accounts = await res.json();
  const tbody = document.getElementById('accounts-body');
  const emptyMsg = document.getElementById('empty-msg');
  tbody.innerHTML = '';
  if (accounts.length === 0) {
    emptyMsg.classList.remove('d-none');
    return;
  }
  emptyMsg.classList.add('d-none');
  accounts.forEach(acc => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(acc.display_name)}</td>
      <td>${escapeHtml(acc.username)}</td>
      <td>${escapeHtml(acc.server)}</td>
      <td class="text-nowrap">
        <button class="btn btn-sm btn-success" onclick="runBot(${acc.id})">Run</button>
        <button class="btn btn-sm btn-primary" onclick="editAccount(${acc.id})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteAccount(${acc.id})">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function runBot(id) {
  window.open('/run?id=' + id);
}

function editAccount(id) {
  window.location.href = '/account?id=' + id;
}

async function deleteAccount(id) {
  if (!confirm('Xóa tài khoản này?')) return;
  await fetch('/api/accounts/' + id, { method: 'DELETE' });
  loadAccounts();
}

// Register modal flow
document.getElementById('btn-verify-code').addEventListener('click', () => {
  const code = document.getElementById('reg-code').value;
  const errEl = document.getElementById('code-error');
  if (code !== REGISTER_CODE) {
    errEl.textContent = 'Mã không đúng';
    return;
  }
  errEl.textContent = '';
  document.getElementById('step-code').classList.add('d-none');
  document.getElementById('step-form').classList.remove('d-none');
  document.getElementById('btn-save-account').classList.remove('d-none');
});

document.getElementById('btn-save-account').addEventListener('click', async () => {
  const data = {
    code: document.getElementById('reg-code').value,
    display_name: document.getElementById('reg-display-name').value,
    username: document.getElementById('reg-username').value,
    password: document.getElementById('reg-password').value,
    server: document.getElementById('reg-server').value
  };
  const errEl = document.getElementById('form-error');
  const res = await fetch('/api/accounts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (res.status === 401) {
    errEl.textContent = 'Mã không đúng';
    return;
  }
  if (!res.ok) {
    errEl.textContent = 'Lỗi khi tạo tài khoản';
    return;
  }
  // Reset modal
  bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
  document.getElementById('reg-code').value = '';
  document.getElementById('reg-display-name').value = '';
  document.getElementById('reg-username').value = '';
  document.getElementById('reg-password').value = '';
  document.getElementById('reg-server').value = '';
  document.getElementById('step-code').classList.remove('d-none');
  document.getElementById('step-form').classList.add('d-none');
  document.getElementById('btn-save-account').classList.add('d-none');
  loadAccounts();
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadAccounts();
</script>
</body>
</html>
