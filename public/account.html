      { id: 'doAccompanyCheckbox', label: 'Free accompany', type: 'checkbox' },
      { id: 'doBrewCheckbox', label: 'Buy/brew once for sermon', type: 'checkbox' },
      { id: 'doBUmapCheckbox', label: 'Buy/use map once for sermon', type: 'checkbox' },

      ]},

        { value: '100000', label: '100k' },

        { value: '10000000', label: '10M' },
        { value: '100000000', label: '100M' },
      ]},
    ]

function generateForm() {
  const container = document.getElementById('form-fields');
  sections.forEach((section, si) => {
    const card = document.createElement('div');
    card.className = 'card bg-dark text-light border-secondary mb-3';
    card.innerHTML = `<div class="card-header">${section.title}</div>`;
    const body = document.createElement('div');
    body.className = 'card-body';
    const row = document.createElement('div');
    row.className = 'row';
    section.fields.forEach(field => {
      const col = document.createElement('div');
      col.className = 'col-md-6 mb-2';
      if (field.type === 'checkbox') {
        col.innerHTML = `
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="${field.id}">
            <label class="form-check-label" for="${field.id}">${field.label}</label>
          </div>`;
      } else if (field.type === 'select') {
        const opts = field.options.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
        col.innerHTML = `
          <label class="form-label" for="${field.id}">${field.label}</label>
          <select class="form-select" id="${field.id}">${opts}</select>`;
      } else {
        col.innerHTML = `
          <label class="form-label" for="${field.id}">${field.label}</label>
          <input type="${field.type}" class="form-control" id="${field.id}"${field.placeholder ? ' placeholder="' + field.placeholder + '"' : ''}>`;
      }
      row.appendChild(col);
    });
    body.appendChild(row);
    card.appendChild(body);
    container.appendChild(card);
  });
}

async function loadAccount() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) return;
  const res = await fetch('/api/accounts/' + id);
  if (!res.ok) return;
  const account = await res.json();
  // Basic info
  ['display_name', 'username', 'password', 'server'].forEach(key => {
    const el = document.getElementById(key);
    if (el) el.value = account[key] || '';
  });
  // Settings
  const settings = account.settings || {};
  sections.forEach(section => {
    section.fields.forEach(field => {
      if (field.basic) return;
      const el = document.getElementById(field.id);
      if (!el) return;
      if (field.type === 'checkbox') {
        el.checked = settings[field.id] === true;
      } else {
        el.value = settings[field.id] || '';
      }
    });
  });
}

function collectData() {
  const data = { settings: {} };
  sections.forEach(section => {
    section.fields.forEach(field => {
      const el = document.getElementById(field.id);
      if (!el) return;
      if (field.basic) {
        data[field.id] = el.value;
      } else if (field.type === 'checkbox') {
        data.settings[field.id] = el.checked;
      } else {
        data.settings[field.id] = el.value;
      }
    });
  });
  return data;
}

document.getElementById('config-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) return;
  const data = collectData();
  const res = await fetch('/api/accounts/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (res.ok) alert('Settings saved successfully!');
  else alert('Error saving settings');
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!confirm('Xóa tài khoản này?')) return;
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) return;
  await fetch('/api/accounts/' + id, { method: 'DELETE' });
  window.location.href = '/dashboard';
});

generateForm();
loadAccount();
</script>
</body>
</html>
